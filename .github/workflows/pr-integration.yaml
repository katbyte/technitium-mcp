---
name: tests
on:
  push:
    branches: [ 'main' ]
  pull_request:
    types: ['opened', 'synchronize']
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'vendor/**'
      - 'makefile'
      - '.scripts/testenv.sh'
      - 'acceptance/**'
      - 'integration/**'
      # the unit tests hold the client against the vendored API document
      - 'api-defs/**'
      - '.github/workflows/pr-integration.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # the unit tests need no server: the tools and the client against canned
  # ones, and the client held against the vendored API document
  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ./.go-version
      - run: make test

  # one job per suite, so a failure names which layer broke: the client's
  # view of the API, or the tools' behaviour on top of it
  integration:
    name: integration (sdk/technitium against real servers)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ./.go-version

      # make owns the containers' lifecycle, so CI runs exactly what a
      # developer runs rather than a second copy of the same steps
      - name: Run the SDK suite
        run: make testacc-integration

      - name: Tear down
        if: always()
        run: TECHNITIUM_TEST_CONTAINER=technitium-mcp-integration .scripts/testenv.sh down || true

  acceptance:
    name: acceptance (tools against real servers)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ./.go-version

      - name: Run the tool suite
        run: make testacc-acceptance

      - name: Tear down
        if: always()
        run: TECHNITIUM_TEST_CONTAINER=technitium-mcp-acceptance .scripts/testenv.sh down || true
